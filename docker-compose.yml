name: linkboard

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkboard-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkboard}
      POSTGRES_DB: ${POSTGRES_DB:-linkboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkboard}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - linkboard

  backend:
    build:
      context: ./backend
      target: dev
    container_name: linkboard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgres://linkboard:linkboard@postgres:5432/linkboard}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - linkboard

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: linkboard-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:3000/',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - linkboard

  # Отдельный инстанс backend для контрактных тестов: тот же образ и код, но
  # подключённый к linkboard_test. Без него api-tests чистили бы тестовую базу,
  # пока сервис читает и пишет в dev-базу linkboard — тесты проверяли бы не то
  # состояние, которым управляют, и попутно затирали данные разработчика.
  # Порт наружу не публикуется: обращение только по внутреннему имени.
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: dev
    container_name: linkboard-backend-test
    restart: "no"
    environment:
      PORT: 8080
      NODE_ENV: development
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://linkboard:linkboard@postgres:5432/linkboard_test}
      BASE_URL: ${TEST_BASE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://localhost:8080/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - linkboard

  api-tests:
    profiles: ["test"]
    build:
      context: ./api-tests
    container_name: linkboard-api-tests
    restart: "no"
    environment:
      API_URL: http://backend-test:8080
      # Не BASE_URL: это имя резервирует под себя Vite/Vitest (import.meta.env),
      # process.env.BASE_URL внутри тестового процесса окажется затёрт.
      TEST_SHORT_URL_BASE: ${TEST_BASE_URL:-http://localhost:8080}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://linkboard:linkboard@postgres:5432/linkboard_test}
    depends_on:
      backend-test:
        condition: service_healthy
    networks:
      - linkboard

  e2e-tests:
    profiles: ["e2e"]
    build:
      context: ./e2e-tests
    container_name: linkboard-e2e-tests
    restart: "no"
    environment:
      BASE_URL: http://frontend:3000
      API_URL: http://backend:8080
      DATABASE_URL: ${TEST_DATABASE_URL:-postgres://linkboard:linkboard@postgres:5432/linkboard_test}
    volumes:
      - ./e2e-tests/playwright-report:/app/playwright-report
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - linkboard

networks:
  linkboard:
    name: linkboard

volumes:
  pgdata:
    name: linkboard_pgdata
  backend_node_modules:
    name: linkboard_backend_node_modules
  frontend_node_modules:
    name: linkboard_frontend_node_modules
